name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: CompeyDev/setup-rokit@v0.2.1
      - run: npm ci
      - run: npm install --global @anthropic-ai/claude-code@2.1.289
      - run: npm run check
